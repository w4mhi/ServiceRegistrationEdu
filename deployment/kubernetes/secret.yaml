apiVersion: v1
kind: Secret
metadata:
  name: serviceregistry-secrets
  namespace: serviceregistry
type: Opaque
stringData:
  # Database connection string (PostgreSQL)
  # IMPORTANT: Replace with actual values and use proper secret management (e.g., sealed-secrets, external-secrets)
  database-connection-string: "Host=postgres-service;Port=5432;Database=serviceregistry;Username=serviceregistry;Password=CHANGE_ME_IN_PRODUCTION"
  
  # SQL Server alternative (uncomment if using SQL Server)
  # database-connection-string: "Server=sqlserver-service;Database=ServiceRegistry;User Id=serviceregistry;Password=CHANGE_ME_IN_PRODUCTION;TrustServerCertificate=true"
  
  # Authentication secrets (P2 - placeholder for when auth is implemented)
  # jwt-secret-key: "YOUR_JWT_SECRET_KEY_MINIMUM_32_CHARACTERS"
  # api-key: "YOUR_API_KEY_FOR_SERVICE_TO_SERVICE_AUTH"
