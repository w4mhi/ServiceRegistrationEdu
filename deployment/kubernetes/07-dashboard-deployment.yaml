apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-registry-dashboard
  namespace: service-registry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-registry-dashboard
  template:
    metadata:
      labels:
        app: service-registry-dashboard
    spec:
      containers:
      - name: dashboard
        image: service-registry-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ConnectionStrings__ServiceRegistry
          valueFrom:
            secretKeyRef:
              name: service-registry-secrets
              key: postgres-connection
        - name: DatabaseProvider
          valueFrom:
            configMapKeyRef:
              name: service-registry-config
              key: DatabaseProvider
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  namespace: service-registry
spec:
  type: ClusterIP
  selector:
    app: service-registry-dashboard
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
