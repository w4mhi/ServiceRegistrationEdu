apiVersion: apps/v1
kind: Deployment
metadata:
  name: serviceregistry-api
  namespace: serviceregistry
  labels:
    app: serviceregistry-api
    component: api
spec:
  replicas: 2  # Minimum replicas for high availability
  selector:
    matchLabels:
      app: serviceregistry-api
  template:
    metadata:
      labels:
        app: serviceregistry-api
        component: api
    spec:
      containers:
      - name: api
        image: your-registry/serviceregistry:latest  # Replace with actual image
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ConnectionStrings__ServiceRegistry
          valueFrom:
            secretKeyRef:
              name: serviceregistry-secrets
              key: database-connection-string
        envFrom:
        - configMapRef:
            name: serviceregistry-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      # Optional: Use pod anti-affinity to spread replicas across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - serviceregistry-api
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: serviceregistry-api
  namespace: serviceregistry
  labels:
    app: serviceregistry-api
spec:
  type: ClusterIP
  selector:
    app: serviceregistry-api
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  sessionAffinity: None
---
